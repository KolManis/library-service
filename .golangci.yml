version: "2"

linters:
  default: standard  # errcheck, gosimple, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint       # ловит err == SentinelErr вместо errors.Is
    - contextcheck    # правильная прокидка context.Context
    - sqlclosecheck   # sql.Rows/Stmt закрыты
    - forbidigo       # запрет конкретных вызовов по паттерну
  settings:
    forbidigo:
      forbid:
        - pattern: '^log\.'
          msg: "используй slog вместо стандартного log"